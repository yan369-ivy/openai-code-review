name: Build and Run OpenAiCodeReview By Main Maven Jar

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Copy openai-code-review-sdk JAR
        run: mvn dependency:copy -Dartifact=cn.yan:openai-code-review-sdk:1.0 -DoutputDirectory=./libs

      - name: Check required secrets
        run: |
          test -n "$DEEPSEEK_API_KEY" || (echo "DEEPSEEK_API_KEY secret is empty" && exit 1)
          test -n "$CODE_TOKEN" || (echo "CODE_TOKEN secret is empty" && exit 1)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}

      - name: Run Code Review
        run: java -jar ./libs/openai-code-review-sdk-1.0.jar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CODE_TOKEN }}
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}
